<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>收藏 · Faro 的旅行</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="ui.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* favorites.html — layout and page-only pieces; tokens and shared components live in ui.css */
html,body{height:100%}
body.fv{overflow:hidden}
#map{position:fixed;inset:0;z-index:0}
/* phone: floating top bar over the map */
.fv-top{position:fixed;left:0;right:0;top:0;z-index:700;padding:calc(10px + var(--safe-t)) 12px 6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;pointer-events:none}
.fv-top>*{pointer-events:auto}
.fv-back{width:44px;height:44px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow-2);display:grid;place-items:center;color:var(--ink)}
.fv-title{height:44px;background:var(--surface);box-shadow:var(--shadow-2);border-radius:12px;padding:0 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.fv-title h1{font-size:17px}
.fv-title .stats{font:600 12px var(--font-num);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth{display:flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--shadow-2);border-radius:12px;padding:4px;height:44px}
.auth:empty{display:none}
.auth img{width:30px;height:30px;border-radius:50%}
#cats{grid-column:1/-1;padding:2px 2px 6px}
#cats .chip{background:var(--surface);box-shadow:var(--shadow-1)}
#cats .chip.on{background:var(--ink);color:var(--bg)}
/* phone: list in a draggable bottom sheet (real height changes so scrolling reaches the bottom) */
.fv-side{position:fixed;left:0;right:0;bottom:0;z-index:800;height:var(--peek,170px);max-height:calc(100dvh - 60px);background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;
  box-shadow:var(--shadow-2);display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.8,.2,1)}
.fv-side.drag{transition:none}
.g-handle{flex-shrink:0;height:30px;border:0;background:none;display:grid;place-items:center;cursor:grab;touch-action:none}
.g-handle span{width:44px;height:5px;border-radius:3px;background:var(--line)}
.fv-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(96px + var(--safe-b))}
.filters{display:grid;gap:8px;margin-bottom:6px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{min-height:34px;border:0;background:none;border-radius:9px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.filters select,.filters input{min-height:40px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:0 12px;min-width:0;font-size:15px}
.filters input{flex:1 1 160px}
.status{font-size:13px;color:var(--ink-2)}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:12px;padding:10px 12px;font-size:14px}
/* list */
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 8px;border-radius:14px;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover,.item.hl{background:var(--surface)}
.item .emo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c)}
.item b{display:block;font-size:16px;line-height:1.3}
.item .m{font-size:13px;color:var(--ink-2)}
.item .n{font-size:14px;margin-top:2px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item .r{font:800 15px var(--font-num);color:var(--star);white-space:nowrap}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tags span{font-size:12px;background:var(--surface-2);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.own{display:flex;gap:6px;margin-top:8px}
.own button{min-height:34px;border:0;background:var(--surface-2);border-radius:10px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
.own .del{color:var(--bad)} .own .armed{background:var(--bad);color:#fff}
/* map pins: category colour + rating badge */
.pin-r{position:absolute;top:-8px;right:-14px;background:#fff;color:#13202B;border-radius:9px;padding:0 5px;font:800 11px/18px var(--font-num);box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
.pop{min-width:200px}.pop b{font-size:16px}.pop p{margin:4px 0}.pop .m{color:var(--ink-2);font-size:13px}
.pop .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.marker-cluster div{background:var(--accent)!important;color:#fff;font:800 13px var(--font-num)}
.marker-cluster{background:color-mix(in srgb,var(--accent) 30%,transparent)!important}
/* FAB, form sheet, pick hint */
#fab{position:fixed;right:16px;bottom:calc(var(--peek,170px) + 14px);z-index:900;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow-2);display:grid;place-items:center;cursor:pointer;transition:bottom .32s}
#fab svg.lucide{width:28px;height:28px}
.sheet-bg{position:fixed;inset:0;background:rgba(14,20,25,.4);z-index:1200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:18px 16px calc(18px + var(--safe-b));display:grid;gap:12px}
.sheet h2{font-size:20px;display:flex;align-items:center;gap:8px}
.sheet label{display:grid;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.sheet input,.sheet select,.sheet textarea{font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--line);cursor:pointer;border-radius:10px}
.starpick button svg.lucide{width:30px;height:30px}
.starpick button.on{color:var(--star)}
.starpick button.on svg.lucide{fill:currentColor}
.locbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.coord{font:600 13px var(--font-num);color:var(--ink-2)}
.check{display:flex!important;align-items:center;gap:10px;font-size:15px!important;color:var(--ink)!important;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.acts2{display:flex;justify-content:flex-end;gap:8px}
#pickHint{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);z-index:1300;background:#13202B;color:#fff;border-radius:14px;padding:8px 8px 8px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-2)}
#pickHint button{min-height:34px;border:0;background:#fff;color:#13202B;border-radius:10px;padding:0 12px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(var(--peek,170px) + 16px);transform:translate(-50%,16px);opacity:0;z-index:3000;background:#13202B;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:92vw;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* tablet + desktop: left column (header, filters, list / form) + full-height map */
@media (min-width:768px){
  body.fv{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100dvh}
  #map{position:relative;inset:auto;grid-column:2;grid-row:1/3;height:100dvh}
  .fv-top{position:static;grid-column:1;grid-row:1;pointer-events:auto;background:var(--bg);padding:16px 16px 4px;border-right:1px solid var(--line)}
  .fv-back,.fv-title,.auth{box-shadow:none;background:var(--surface-2)}
  #cats .chip{box-shadow:none;background:var(--surface-2)}
  .fv-side{position:static;grid-column:1;grid-row:2;height:auto;max-height:none;border-radius:0;box-shadow:none;transition:none;border-right:1px solid var(--line)}
  .g-handle{display:none}
  .fv-scroll{padding:6px 16px 96px}
  #fab{left:calc(min(400px,100vw) - 78px);right:auto;bottom:24px}
  #toast{bottom:24px}
  /* the form replaces the list inside the left column instead of a modal */
  #sheetBg.inline{position:static;inset:auto;background:none;display:block}
  #sheetBg.inline .sheet{max-height:none;border-radius:var(--r-m);padding:14px;box-shadow:var(--shadow-1)}
}
</style>
</head>
<body class="fv">
<div id="map" role="region" aria-label="收藏地图"></div>
<header class="fv-top">
  <a class="fv-back" href="./" aria-label="返回我的旅行"><i data-lucide="chevron-left"></i></a>
  <div class="fv-title"><h1>收藏</h1><div class="stats" id="stats">加载中…</div></div>
  <div class="auth" id="auth"></div>
  <div class="chips" id="cats" role="group" aria-label="类型"></div>
</header>
<aside class="fv-side" id="side" aria-label="收藏列表">
  <button class="g-handle" id="handle" aria-label="展开或收起列表"><span></span></button>
  <div class="fv-scroll" id="sideScroll">
    <div class="filters" id="filters">
      <div class="frow">
        <div class="seg" id="ratingSeg" role="group" aria-label="评分"><button data-r="0" class="on">全部</button><button data-r="4">≥4★</button><button data-r="5">5★</button></div>
        <select id="tripSel" aria-label="旅行"><option value="">全部旅行</option></select>
      </div>
      <div class="frow">
        <input id="q" type="search" placeholder="搜索名称、城市、标签" aria-label="搜索">
        <div class="seg" id="sortSeg" role="group" aria-label="排序"><button data-s="rating" class="on">评分</button><button data-s="date">日期</button></div>
      </div>
      <div class="status" id="status"></div>
      <div class="notice" id="notOwner" hidden>这个账号没有编辑权限，只能查看公开的收藏。</div>
      <div class="notice" id="settings" hidden></div>
    </div>
    <div id="formSlot"></div>
    <div id="list"><div class="sk" style="height:64px;margin:8px 0"></div><div class="sk" style="height:64px;margin:8px 0"></div></div>
  </div>
</aside>

<button id="fab" aria-label="添加收藏" hidden><i data-lucide="plus"></i></button>
<div id="pickHint" hidden>在地图上点一下选位置 <button id="pickCancel">取消</button></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// Replace with your Google account uid (shown under 设置 after signing in), and the same value in firestore.rules
const OWNER_UID = 'OWNER_UID';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
// [lucide icon, label, colour]
const CATS = { food: ['utensils', '餐馆', '#E8613C'], cafe: ['coffee', '咖啡', '#9A6B3F'], bar: ['wine', '酒吧', '#7B5BC9'], spot: ['camera', '景点', '#0B7A8C'], stay: ['bed-double', '住宿', '#C98A0B'], shop: ['shopping-bag', '购物', '#C2397A'], other: ['star', '其他', '#4A5966'] };
const ic = (n, cls = '') => `<i data-lucide="${n}"${cls ? ` class="${cls}"` : ''}></i>`;
const icons = root => { try { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.75 }, root }); } catch (e) {} };
const stars = n => `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`;
const price = n => n ? '¥'.repeat(n) : '';
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

let favs = [], trips = [], auth = null, db = null, user = null, owner = false, unsub = null;
const F = { cats: new Set(Object.keys(CATS)), min: 0, trip: new URLSearchParams(location.search).get('trip') || '', q: '', sort: 'rating' };

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false }).setView([20, 110], 3);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'tiles', attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 }); map.addLayer(cluster);
const markers = {};
let fitted = false;
const pinIcon = f => { const [i, , c] = CATS[f.category] || CATS.other;
  return L.divIcon({ className: '', html: `<div class="mk" data-fav="${esc(f.id)}" style="--c:${c}">${ic(i)}<span class="pin-r">${f.rating}★</span></div>`, iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18] }); };
function popupHtml(f) {
  const [, n] = CATS[f.category] || CATS.other, link = safeUrl(f.link);
  return `<div class="pop"><b>${esc(f.name)}</b>${f.private ? ' ' + ic('lock', 'i18') : ''}<div>${stars(f.rating)} <span class="num">${price(f.price)}</span></div>
    ${f.note ? `<p>${esc(f.note)}</p>` : ''}<div class="m">${esc([f.city, f.country].filter(Boolean).join(' · '))}${f.visitedAt ? ' · ' + esc(f.visitedAt) : ''} · ${n}</div>
    ${f.tags && f.tags.length ? `<div class="tags">${f.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="acts"><a class="btn btn-sm btn-primary" href="https://www.google.com/maps/search/?api=1&query=${+f.lat},${+f.lng}" target="_blank" rel="noopener">${ic('navigation', 'i18')}导航</a>${link ? `<a class="btn btn-sm" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${ic('link', 'i18')}链接</a>` : ''}</div>
    ${owner ? `<div class="own"><button data-edit="${esc(f.id)}">改</button><button class="del" data-del="${esc(f.id)}">删</button></div>` : ''}</div>`;
}
map.on('popupopen', e => { bindOwn(e.popup.getElement()); icons(e.popup.getElement()); });

/* ---------- filters ---------- */
$('#cats').innerHTML = Object.entries(CATS).map(([k, [i, n]]) => `<button class="chip on" data-c="${k}" aria-pressed="true">${ic(i, 'i18')}${n}</button>`).join('');
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; const k = b.dataset.c;
  F.cats.has(k) ? F.cats.delete(k) : F.cats.add(k); b.classList.toggle('on', F.cats.has(k)); b.setAttribute('aria-pressed', F.cats.has(k)); render(); });
$('#ratingSeg').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; F.min = +b.dataset.r; document.querySelectorAll('#ratingSeg button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('#sortSeg').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; F.sort = b.dataset.s; document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('#tripSel').addEventListener('change', e => { F.trip = e.target.value; fitted = false; render(); });
$('#q').addEventListener('input', e => { F.q = e.target.value.trim().toLowerCase(); render(); });
const tripName = id => (trips.find(t => t.id === id) || {}).title || id;
function filtered() {
  return favs.filter(f => F.cats.has(f.category in CATS ? f.category : 'other') && f.rating >= F.min && (!F.trip || f.tripId === F.trip)
      && (!F.q || [f.name, f.city, f.country, ...(f.tags || [])].join(' ').toLowerCase().includes(F.q)))
    .sort((a, b) => F.sort === 'date' ? (b.visitedAt || '').localeCompare(a.visitedAt || '') || b.rating - a.rating
                                       : b.rating - a.rating || (b.visitedAt || '').localeCompare(a.visitedAt || ''));
}

/* ---------- render ---------- */
function render() {
  const list = filtered();
  const avg = favs.length ? (favs.reduce((s, f) => s + f.rating, 0) / favs.length).toFixed(1) : '–';
  $('#stats').textContent = `${favs.length} 个地方 · 平均 ${avg}★ · ${new Set(favs.map(f => f.city).filter(Boolean)).size} 个城市`;
  cluster.clearLayers(); for (const k in markers) delete markers[k];
  list.forEach(f => { const m = L.marker([f.lat, f.lng], { icon: pinIcon(f) }).bindPopup(() => popupHtml(f), { maxWidth: 260 }); markers[f.id] = m; cluster.addLayer(m); });
  if (list.length && !fitted) { map.fitBounds(list.map(f => [f.lat, f.lng]), { padding: [30, 30], maxZoom: 15 }); fitted = true; }
  $('#list').innerHTML = list.length ? list.map(f => { const [i, , c] = CATS[f.category] || CATS.other;
    return `<div class="item" data-id="${esc(f.id)}" tabindex="0"><span class="emo" style="--c:${c}">${ic(i)}</span>
      <div><b>${esc(f.name)}${f.private ? ' ' + ic('lock', 'i18') : ''}</b><div class="m">${esc([f.city, f.visitedAt, price(f.price), f.tripId ? tripName(f.tripId) : ''].filter(Boolean).join(' · '))}</div>
        ${f.note ? `<div class="n">${esc(f.note)}</div>` : ''}${f.tags && f.tags.length ? `<div class="tags">${f.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
        ${owner ? `<div class="own"><button data-edit="${esc(f.id)}">改</button><button class="del" data-del="${esc(f.id)}">删</button></div>` : ''}</div>
      <span class="r">${f.rating}★</span></div>`; }).join('')
    : `<div class="empty">${ic(favs.length ? 'search-x' : 'heart')}${favs.length ? '没有符合筛选的收藏。' : '还没有收藏。登录后点右下角的＋添加第一个地方。'}${favs.length ? '' : (owner ? '<button class="btn btn-primary" onclick="openForm(null)">添加第一个地方</button>' : (auth ? '<button class="btn" onclick="signIn()">登录</button>' : ''))}</div>`;
  icons($('#list')); icons($('#map'));
}
$('#list').addEventListener('click', e => {
  if (e.target.closest('.own')) return;
  const it = e.target.closest('.item'); if (!it) return; const m = markers[it.dataset.id]; if (!m) return;
  if (innerWidth < 768) setSheet('min');
  cluster.zoomToShowLayer(m, () => { map.setView(m.getLatLng(), Math.max(map.getZoom(), 16)); m.openPopup(); });
});
bindOwn($('#list'));
const markEl = id => document.querySelector(`.mk[data-fav="${CSS.escape(id)}"]`);
$('#list').addEventListener('mouseover', e => { const it = e.target.closest('.item'); document.querySelectorAll('.mk.on').forEach(x => x.classList.remove('on')); if (it) { const m = markEl(it.dataset.id); if (m) m.classList.add('on'); } });
$('#list').addEventListener('mouseleave', () => document.querySelectorAll('.mk.on').forEach(x => x.classList.remove('on')));
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('item')) e.target.click(); });

/* ---------- owner actions: edit / delete with inline double-confirm ---------- */
let armed = null;
function bindOwn(root) {
  if (!root || root.dataset.bound) return; root.dataset.bound = '1';
  root.addEventListener('click', async e => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) { e.stopPropagation(); map.closePopup(); openForm(favs.find(f => f.id === ed.dataset.edit)); }
    if (del) { e.stopPropagation(); const id = del.dataset.del;
      if (armed !== id) { armed = id; del.textContent = '确认删除？'; del.classList.add('armed');
        setTimeout(() => { if (armed === id) { armed = null; del.textContent = '删'; del.classList.remove('armed'); } }, 3000); return; }
      armed = null; map.closePopup();
      try { await db.collection('favorites').doc(id).delete(); toast('已删除'); } catch (err) { toast(errMsg(err)); } }
  });
}
const errMsg = err => !user ? '请先登录' : err && err.code === 'permission-denied' ? '没有权限（规则里的 OWNER_UID 还没填，或者不是你的账号）' : err && /unavailable|network/i.test(err.code || err.message || '') ? '网络问题，稍后再试' : '保存失败：' + ((err && err.code) || '未知错误');

/* ---------- add / edit form ---------- */
let form = null, tempMarker = null;
function sheetHtml(f) {
  return `<div class="sheet-bg${innerWidth >= 768 ? ' inline' : ''}" id="sheetBg"><form class="sheet" id="favForm" novalidate>
    <h2>${innerWidth >= 768 ? `<button type="button" class="btn btn-sm btn-icon" id="fBack" aria-label="返回列表">${ic('arrow-left', 'i18')}</button>` : ''}${f.id ? '修改收藏' : '添加收藏'}</h2>
    <label>名称<input id="fName" maxlength="60" value="${esc(f.name)}" required></label>
    <div class="two"><label>类型<select id="fCat">${Object.entries(CATS).map(([k, [, n]]) => `<option value="${k}" ${f.category === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label>价格<select id="fPrice">${['不填', '¥', '¥¥', '¥¥¥', '¥¥¥¥'].map((t, i) => `<option value="${i}" ${f.price === i ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
    <div><span class="coord">评分</span><div class="starpick" id="fStars" role="radiogroup" aria-label="评分">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-v="${i}" role="radio" aria-label="${i} 星" aria-checked="${i === f.rating}" class="${i <= f.rating ? 'on' : ''}">${ic('star')}</button>`).join('')}</div></div>
    <label>短评<textarea id="fNote" rows="2" maxlength="500">${esc(f.note)}</textarea></label>
    <div class="two"><label>城市<input id="fCity" maxlength="30" value="${esc(f.city)}"></label><label>国家/地区<input id="fCountry" maxlength="30" value="${esc(f.country)}"></label></div>
    <div class="two"><label>旅行<select id="fTrip"><option value="">不属于某次旅行</option>${trips.map(t => `<option value="${esc(t.id)}" ${f.tripId === t.id ? 'selected' : ''}>${esc(t.title)}</option>`).join('')}</select></label>
      <label>日期<input id="fDate" type="date" value="${esc(f.visitedAt || '')}"></label></div>
    <label>标签（用逗号或空格分开，最多 8 个）<input id="fTags" value="${esc((f.tags || []).join('，'))}"></label>
    <label>链接（谷歌地图、小红书、相册）<input id="fLink" type="url" maxlength="500" value="${esc(f.link)}" placeholder="https://"></label>
    <div><span class="coord">位置</span><div class="locbtns"><button type="button" class="btn btn-sm" id="fGeo">${ic('locate-fixed', 'i18')}用我现在的位置</button><button type="button" class="btn btn-sm" id="fPick">${ic('map-pin', 'i18')}在地图上点一下</button></div>
      <input id="fGlink" placeholder="或粘贴谷歌地图链接" style="margin-top:6px"><div class="coord" id="fCoord" style="margin-top:4px">${f.lat != null ? `${(+f.lat).toFixed(5)}, ${(+f.lng).toFixed(5)}` : '还没有位置'}</div></div>
    <label class="check"><input type="checkbox" id="fPrivate" ${f.private ? 'checked' : ''}> 仅自己可见</label>
    <div class="acts2"><button type="button" class="btn" id="fCancel">取消</button><button type="submit" class="btn btn-primary" id="fSave">保存</button></div>
  </form></div>`;
}
function openForm(f) {
  if (!owner) return;
  form = f ? { ...f } : { id: null, name: '', category: 'food', rating: 5, note: '', city: '', country: '', tripId: F.trip || null, visitedAt: todayStr(), price: 0, tags: [], link: '', private: false, lat: null, lng: null };
  if (innerWidth >= 768) { $('#formSlot').innerHTML = sheetHtml(form); $('#list').hidden = true; $('#filters').hidden = true; $('#sideScroll').scrollTop = 0; }
  else document.body.insertAdjacentHTML('beforeend', sheetHtml(form));
  icons($('#sheetBg')); if ($('#fBack')) $('#fBack').addEventListener('click', closeForm);
  if (form.lat != null) setTemp(form.lat, form.lng);
  const s = $('#sheetBg');
  s.addEventListener('click', e => { if (e.target === s) closeForm(); });
  $('#fStars').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; form.rating = +b.dataset.v;
    $('#fStars').querySelectorAll('button').forEach(x => { x.classList.toggle('on', +x.dataset.v <= form.rating); x.setAttribute('aria-checked', +x.dataset.v === form.rating); }); });
  $('#fCancel').addEventListener('click', closeForm);
  $('#fGeo').addEventListener('click', useMyLocation);
  $('#fPick').addEventListener('click', () => { if (!s.classList.contains('inline')) s.hidden = true; $('#pickHint').hidden = false; });
  $('#fGlink').addEventListener('input', e => { const v = e.target.value.trim(); if (!v) return; const r = parseGmaps(v);
    if (r === 'short') $('#fCoord').textContent = '这是短链接，网页读不出坐标。请在浏览器打开后复制完整链接。';
    else if (r) { setLoc(r[0], r[1]); map.setView(r, 16); } else $('#fCoord').textContent = '没识别出坐标，换完整的谷歌地图链接，或者在地图上点一下。'; });
  $('#favForm').addEventListener('submit', e => { e.preventDefault(); save(); });
  $('#fName').focus();
}
function closeForm() { const s = $('#sheetBg'); if (s) s.remove(); $('#list').hidden = false; $('#filters').hidden = false; $('#pickHint').hidden = true; form = null; if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; } }
function setTemp(lat, lng) { if (tempMarker) tempMarker.setLatLng([lat, lng]); else tempMarker = L.marker([lat, lng], { zIndexOffset: 3000 }).addTo(map); }
function setLoc(lat, lng) { form.lat = +(+lat).toFixed(6); form.lng = +(+lng).toFixed(6); setTemp(form.lat, form.lng); const c = $('#fCoord'); if (c) c.textContent = `${form.lat.toFixed(5)}, ${form.lng.toFixed(5)}`; }
map.on('click', e => { if (!form || $('#pickHint').hidden) return; setLoc(e.latlng.lat, e.latlng.lng); $('#pickHint').hidden = true; $('#sheetBg').hidden = false; });
$('#pickCancel').addEventListener('click', () => { $('#pickHint').hidden = true; if ($('#sheetBg')) $('#sheetBg').hidden = false; });
function useMyLocation() {
  if (!navigator.geolocation) return toast('这个浏览器不支持定位，可以在地图上点一下或粘贴链接');
  $('#fCoord').textContent = '正在定位…';
  navigator.geolocation.getCurrentPosition(p => { setLoc(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 16); },
    () => { $('#fCoord').textContent = form && form.lat != null ? `${form.lat.toFixed(5)}, ${form.lng.toFixed(5)}` : '还没有位置';
      toast('没拿到位置（可能拒绝了定位）。可以在地图上点一下，或粘贴谷歌地图链接'); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
function parseGmaps(u) {
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(u)) return 'short';
  let s = u; try { s = decodeURIComponent(u); } catch (e) {}
  for (const p of [/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/, /[?&](?:q|query)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/, /[?&]ll=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/, /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/]) {
    const m = s.match(p); if (m && Math.abs(+m[1]) <= 90 && Math.abs(+m[2]) <= 180) return [+m[1], +m[2]]; }
  return null;
}
async function save() {
  const name = $('#fName').value.trim(), link = $('#fLink').value.trim();
  if (!name) return toast('先填名称');
  if (form.lat == null) return toast('先设置位置');
  if (link && !safeUrl(link)) return toast('链接要以 http 或 https 开头');
  const tags = $('#fTags').value.split(/[,，、\s]+/).map(t => t.trim().slice(0, 12)).filter(Boolean).slice(0, 8);
  const now = Date.now(), date = $('#fDate').value;
  const doc = { name: name.slice(0, 60), category: $('#fCat').value, lat: form.lat, lng: form.lng, rating: form.rating, note: $('#fNote').value.trim().slice(0, 500),
    city: $('#fCity').value.trim().slice(0, 30), country: $('#fCountry').value.trim().slice(0, 30), tripId: $('#fTrip').value || null,
    visitedAt: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : null, price: +$('#fPrice').value, tags, link, private: $('#fPrivate').checked, at: form.at || now, updatedAt: now };
  const btn = $('#fSave'); btn.disabled = true;
  const ref = form.id ? db.collection('favorites').doc(form.id) : db.collection('favorites').doc();
  // with offline cache the write is queued locally and resolves once the server confirms
  const write = ref.set(doc);
  const done = await Promise.race([write.then(() => 'ok', err => err), new Promise(r => setTimeout(() => r('pending'), 8000))]);
  btn.disabled = false;
  if (done === 'ok') { toast('已保存'); closeForm(); }
  else if (done === 'pending') { toast('已保存到本机，联网后会自动同步'); closeForm(); }
  else toast(errMsg(done));
}
$('#fab').addEventListener('click', () => openForm(null));

/* phone: list sheet with three heights (drag or tap the handle) */
const side = $('#side'), handle = $('#handle'), topH = () => ($('.fv-top') || {}).offsetHeight || 110;
const SHEET = { min: () => 170, half: () => Math.round(innerHeight * .5), full: () => innerHeight - topH() - 6 };
let sheetState = 'min';
function setSheet(st) { sheetState = st; document.documentElement.style.setProperty('--peek', innerWidth < 768 ? SHEET[st]() + 'px' : '0px'); handle.setAttribute('aria-label', st === 'full' ? '收起列表' : '展开列表'); }
let dragY = null, dragStart = 0, dragMoved = false;
handle.addEventListener('click', () => { if (dragMoved) return; setSheet(sheetState === 'min' ? 'half' : sheetState === 'half' ? 'full' : 'min'); });
handle.addEventListener('pointerdown', e => { dragY = e.clientY; dragStart = SHEET[sheetState](); dragMoved = false; side.classList.add('drag'); handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointermove', e => { if (dragY === null) return; const dy = dragY - e.clientY; if (Math.abs(dy) > 4) dragMoved = true;
  document.documentElement.style.setProperty('--peek', Math.max(120, Math.min(SHEET.full(), dragStart + dy)) + 'px'); });
handle.addEventListener('pointerup', e => { if (dragY === null) return; side.classList.remove('drag'); const h = dragStart + (dragY - e.clientY); dragY = null;
  if (!dragMoved) return; setSheet(Object.keys(SHEET).sort((a, b) => Math.abs(SHEET[a]() - h) - Math.abs(SHEET[b]() - h))[0]); setTimeout(() => { dragMoved = false; }, 0); });
addEventListener('resize', () => { setSheet(sheetState); map.invalidateSize(); });
setSheet('min'); icons(document);

/* ---------- auth UI ---------- */
function renderAuth() {
  const a = $('#auth');
  if (!auth) { a.innerHTML = ''; return; }
  if (!user || user.isAnonymous) { a.innerHTML = `<button class="btn btn-sm btn-primary" id="signIn">${ic('log-in', 'i18')}登录</button>`; $('#signIn').onclick = signIn; }
  else { a.innerHTML = `${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : ''}<button class="btn btn-sm btn-icon" id="gear" aria-label="设置">${ic('settings', 'i18')}</button><button class="btn btn-sm" id="signOut">退出</button>`;
    $('#signOut').onclick = () => auth.signOut(); $('#gear').onclick = () => { const s = $('#settings'); s.hidden = !s.hidden; }; }
  $('#settings').innerHTML = user ? `设置 · 当前账号 uid：<code id="uid" style="word-break:break-all">${esc(user.uid)}</code> <button class="btn btn-sm" id="copyUid">复制</button>` : '';
  icons(a);
  if (user) $('#copyUid').onclick = () => navigator.clipboard.writeText(user.uid).then(() => toast('已复制 uid'), () => toast('复制失败，手动选中复制'));
  $('#notOwner').hidden = !(user && !owner);
  $('#fab').hidden = !owner;
}
async function signIn() {
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (err) { toast(err.code === 'auth/popup-blocked' ? '弹窗被浏览器拦截了，允许弹窗后再试' : err.code === 'auth/popup-closed-by-user' ? '登录窗口被关掉了' : err.code === 'auth/operation-not-allowed' ? 'Google 登录还没在 Firebase 里启用' : err.code === 'auth/unauthorized-domain' ? '这个网址还没加入 Firebase 授权网域' : '登录失败：' + err.code); }
}
function subscribe() {
  if (unsub) unsub();
  const col = db.collection('favorites');
  // non-owners must query only public docs, otherwise the rules reject the whole query
  unsub = (owner ? col : col.where('private', '==', false)).onSnapshot(s => {
    favs = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(f => typeof f.lat === 'number' && typeof f.lng === 'number' && f.name);
    $('#status').textContent = s.metadata.fromCache ? '离线，显示的是本机缓存' : '';
    render();
  }, () => { $('#status').textContent = '无法读取收藏，检查一下网络。'; });
}

/* ---------- boot: trips list, then Firebase in the background ---------- */
fetch('trips.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  trips = (d.trips || []).filter(t => t && t.id);
  $('#tripSel').innerHTML = '<option value="">全部旅行</option>' + trips.map(t => `<option value="${esc(t.id)}">${esc(t.title)}</option>`).join('');
  $('#tripSel').value = F.trip; render();
}).catch(() => {});
render();
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
(async function start() {
  let ok = false;
  const fail = () => { if (!ok) { $('#status').textContent = '无法连接数据库。地图和筛选照常可用。如果你在中国大陆，可能需要开启 VPN。'; $('#stats').textContent = '收藏'; } };
  const timer = setTimeout(fail, 10000);
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try { for (const s of [SDK + 'firebase-app-compat.js', SDK + 'firebase-auth-compat.js', SDK + 'firebase-firestore-compat.js', 'firebase-config.js']) await loadScript(s);
    firebase.initializeApp(window.FIREBASE_CONFIG); }
  catch (e) { clearTimeout(timer); fail(); return; }
  db = firebase.firestore();
  try { await db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}   // offline cache; ignore if unsupported
  auth = firebase.auth(); ok = true; clearTimeout(timer);
  auth.onAuthStateChanged(u => { user = u; owner = !!u && u.uid === OWNER_UID; renderAuth(); subscribe(); render(); });
})();
</script>
</body>
</html>
