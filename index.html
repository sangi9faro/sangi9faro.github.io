<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1419" media="(prefers-color-scheme: dark)">
<script>/* theme-color follows a manual light/dark switch (data-theme) */(function(){var C={light:'#F4F6F8',dark:'#0E1419'},r=document.documentElement;function s(){var t=r.getAttribute('data-theme');document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=C[t]||(/dark/.test(m.media)?C.dark:C.light)})}s();new MutationObserver(s).observe(r,{attributes:true,attributeFilter:['data-theme']})})();</script>
<meta name="robots" content="noindex,nofollow">
<title>Faro 的旅行</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="旅行">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="ui.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* index.html — layout only; tokens and shared components live in ui.css */
.h{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "up" "map" "rec";gap:0 24px;padding:calc(18px + var(--safe-t)) 16px calc(96px + var(--safe-b));max-width:1600px;margin:0 auto}
.h-head{grid-area:head}
.h-up{grid-area:up}
.h-mapcol{grid-area:map}
.h-rec{grid-area:rec}
/* side nav: bottom tab bar on phones */
.h-side{position:fixed;left:0;right:0;bottom:0;z-index:900;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 16px calc(6px + var(--safe-b));display:flex;justify-content:space-around}
.h-side .brand,.h-side .theme{display:none}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;min-height:48px;justify-content:center;border-radius:12px;color:var(--ink-2);font-size:12px;font-weight:700}
.nav-i[aria-current="page"]{color:var(--accent)}
/* head */
.hello{font-size:28px;font-weight:800;letter-spacing:-.01em}
.stats{display:flex;gap:22px;margin:10px 0 4px}
.stat b{display:block;font:800 28px/1.1 var(--font-num)}
.stat span{font-size:13px;color:var(--ink-2)}
.favline{display:inline-flex;align-items:center;gap:6px;margin:8px 0 2px;font-weight:700}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.sec h2{font-size:20px}
/* upcoming hero card */
.hero{position:relative;display:block;border-radius:var(--r-l);overflow:hidden;min-height:300px;background:var(--surface-2) center/cover no-repeat;color:#fff;transition:transform .15s}
.hero:active{transform:scale(.98)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,20,25,0) 30%,rgba(14,20,25,.78) 100%)}
.hero .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px 18px 16px}
.hero .pill{position:absolute;z-index:1;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:#13202B;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.hero .pill i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.hero .pill.now i{background:var(--coral)}
.hero h3{font-size:28px;font-weight:800}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:14px;opacity:.92}
.hero .meta .num{font-weight:700}
/* coral deepened slightly so the small white label stays ≥ 4.5:1 */
.cd{position:absolute;z-index:1;top:12px;right:12px;background:color-mix(in srgb,var(--coral) 80%,#000);color:#fff;border-radius:14px;padding:6px 12px;text-align:center;line-height:1}
.cd b{display:block;font:800 30px/1 var(--font-num)}
.cd span{font-size:12px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.upmore{display:grid;gap:14px}
/* footprint map */
.mapcard{position:relative;height:240px;border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1)}
#map{position:absolute;inset:0}
.mapbtn{position:absolute;z-index:500;top:10px;right:10px;background:var(--surface);box-shadow:var(--shadow-2)}
.mapcard.full{position:fixed;inset:0;height:auto;border-radius:0;z-index:2000}
/* records */
.year{font:800 17px var(--font-num);color:var(--ink-2);margin:18px 2px 10px}
.grid{display:grid;gap:12px}
.tc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding:10px;color:var(--ink);transition:transform .15s,box-shadow .15s}
.tc:active{transform:scale(.98)}
.tc .th{aspect-ratio:1;border-radius:12px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-weight:800}
.tc h3{font-size:17px}
.tc .m{font-size:13px;color:var(--ink-2);margin-top:2px}
.tc.hl,.hero.hl{box-shadow:0 0 0 3px var(--accent)}
.sk-hero{height:300px}
.sk-row{height:96px;margin-top:12px}
.err{color:var(--bad)}
.credit{font-size:12px;color:var(--ink-2);margin:28px 2px 0}
.credit a{text-decoration:underline;color:var(--ink-2)}
/* tablet + desktop: side nav | content | sticky full-height map */
@media (min-width:768px){
  .h{grid-template-columns:200px minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"side head map" "side up map" "side rec map";align-items:start;padding:28px 24px 40px 0;max-width:1600px}
  .h-side{position:sticky;top:0;grid-area:side;align-self:start;height:100dvh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);
    background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;padding:24px 14px;margin-top:-28px}
  .h-side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 8px 18px}
  .h-side .brand img{width:34px;height:34px;border-radius:10px}
  .nav-i{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:0 12px;min-height:44px;color:var(--ink)}
  .nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .h-side .theme{display:flex;margin-top:auto}
  .h-mapcol{position:sticky;top:0;grid-row:1/4;padding-top:2px}
  .h-mapcol .sec{margin-top:0}
  .mapcard{height:calc(100dvh - 96px)}
  .mapbtn{display:none}
  .hero{min-height:360px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tc{grid-template-columns:minmax(0,1fr);padding:0;overflow:hidden}
  .tc .th{aspect-ratio:4/3;border-radius:0}
  .tc .tx{padding:10px 14px 14px}
}
@media (min-width:1200px){
  .h{grid-template-columns:220px minmax(0,1.5fr) minmax(0,1fr)}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero{min-height:400px}
  .hello{font-size:40px}
}
/* owner tools (sign in, ＋ new trip, ⋯ per card) */
.owner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2)}
.owner .btn{min-height:36px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.cardwrap{position:relative}
.cmenu-b{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border:0;border-radius:12px;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;cursor:pointer}
.hero .cmenu-b,.cardwrap:has(.cd) .cmenu-b{top:auto;bottom:14px;right:14px}   /* keep clear of the countdown */
.cardwrap:has(.cmenu-b) .hero .in{padding-right:52px}
.tc+.cmenu-b{background:var(--surface-2);color:var(--ink)}
.cmenu{position:fixed;z-index:2400;min-width:200px;padding:6px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-2);border:1px solid var(--line);display:grid;gap:2px}
.cmenu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink);font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.cmenu button:hover{background:var(--surface-2)} .cmenu button.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="h">
  <nav class="h-side" aria-label="导航">
    <div class="brand"><img src="icon-192.png" alt="">Faro</div>
    <a class="nav-i" href="./" aria-current="page"><i data-lucide="map"></i>旅行</a>
    <a class="nav-i" href="favorites.html"><i data-lucide="heart"></i>收藏</a>
    <button class="btn btn-sm theme" id="themeBtn" aria-label="切换深色模式"><i data-lucide="moon"></i><span>深色模式</span></button>
  </nav>

  <header class="h-head">
    <h1 class="hello" id="title">Faro 的旅行</h1>
    <div class="stats" id="stats"><div class="sk" style="width:220px;height:46px"></div></div>
    <a class="favline" id="favLine" href="favorites.html" hidden></a>
    <div class="owner" id="owner"></div>
  </header>

  <section class="h-up" aria-labelledby="upT">
    <div class="sec"><h2 id="upT">即将出发</h2><button class="btn btn-sm btn-primary" id="newTrip" hidden><i data-lucide="plus" class="i18"></i>新建旅行</button></div>
    <div id="upcoming"><div class="sk sk-hero"></div></div>
  </section>

  <section class="h-mapcol" aria-label="足迹地图">
    <div class="sec" id="mapSec"><h2>足迹</h2></div>
    <div class="mapcard card" id="mapcard"><div id="map"></div>
      <button class="btn btn-sm mapbtn" id="mapBtn" aria-label="全屏地图"><i data-lucide="maximize-2" class="i18"></i></button></div>
  </section>

  <section class="h-rec" aria-labelledby="recT">
    <div class="sec"><h2 id="recT">旅行记录</h2></div>
    <div id="records"><div class="sk sk-row"></div></div>
    <p class="credit">封面：台北 chsyang（公有领域）· 芽庄 Minh Duc Ly（公有领域），来自 <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> · 地图 © OpenStreetMap contributors。iPhone 用 Safari「分享 → 添加到主屏幕」，可以像 App 一样打开。</p>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="t/modules/cover.js"></script>
<script src="t/modules/countries.js"></script>
<script src="t/modules/editor.js"></script>
<script src="t/modules/invite.js"></script>
<script src="t/modules/newtrip.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icons = root => { try { if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.75 }, root }); } catch (e) {} };
const DAY = 86400000;
// ?today=2027-01-01 previews the page on another date
const TODAY = (() => { const q = new URLSearchParams(location.search).get('today'); const d = q ? new Date(q + 'T12:00:00') : new Date(); return isNaN(d) ? new Date() : d; })();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = ymd(TODAY);
const days = t => Math.round((new Date(t.end) - new Date(t.start)) / DAY) + 1;
const status = t => today < t.start ? 'planned' : today > t.end ? 'done' : 'now';
const md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
const range = t => `${t.start.slice(0, 4)}.${md(t.start)} – ${md(t.end)}`;
const target = t => (t.site && (t.site.guide || t.site.home)) || `trip.html?id=${encodeURIComponent(t.id)}`;
const covers = {};   // tripId → cover data (trips/{id}/cover/main)
const color = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#0B7A8C';
const bg = t => TripCover.css(t, covers[t.id]);
const photo = t => TripCover.hasPhoto(t, covers[t.id]);

/* theme toggle (shared across all pages via localStorage) */
function syncThemeBtn() { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeBtn').innerHTML = `<i data-lucide="${dark ? 'sun' : 'moon'}"></i><span>${dark ? '浅色模式' : '深色模式'}</span>`; $('#themeBtn').setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式'); icons($('#themeBtn')); }
$('#themeBtn').addEventListener('click', () => { const dark = !(document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {} syncThemeBtn(); });
syncThemeBtn();

/* footprint map: one layer per trip so cards and points can highlight each other */
let map = null; const tripLayers = {};
function hl(id, on) {
  document.querySelectorAll(`[data-trip="${CSS.escape(id)}"]`).forEach(el => el.classList.toggle('hl', on));
  const L0 = tripLayers[id]; if (!L0) return;
  L0.line && L0.line.setStyle({ weight: on ? 6 : 4, opacity: on ? 1 : .85 });
  L0.pts.forEach(m => m.setStyle({ radius: on ? 10 : 7 }));
}
function buildMap(trips) {
  if (!window.L) { $('#map').innerHTML = '<div class="empty"><i data-lucide="map-off"></i>地图加载失败，检查一下网络。</div>'; icons($('#map')); return; }
  map = L.map('map', { zoomControl: false, scrollWheelZoom: innerWidth >= 768 });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'tiles', attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  const all = [];
  trips.forEach(t => {
    const ps = (t.places || []).filter(p => typeof p.lat === 'number' && typeof p.lng === 'number'); if (!ps.length) return;
    const c = color(t.color), layer = { pts: [] };
    if (ps.length > 1) layer.line = L.polyline(ps.map(p => [p.lat, p.lng]), { color: c, weight: 4, opacity: .85 }).addTo(map);
    ps.forEach(p => { all.push([p.lat, p.lng]);
      const m = L.circleMarker([p.lat, p.lng], { radius: 7, color: '#fff', weight: 2.5, fillColor: c, fillOpacity: 1 }).addTo(map)
        .bindPopup(`<b>${esc(t.title)}</b> · ${esc(p.name)}<br><a href="${esc(target(t))}">进入这次旅行 ›</a>`);
      m.on('mouseover', () => hl(t.id, true)); m.on('mouseout', () => hl(t.id, false)); layer.pts.push(m); });
    tripLayers[t.id] = layer;
  });
  if (all.length) map.fitBounds(all, { padding: [36, 36], maxZoom: 9 }); else map.setView([20, 110], 3);
}
$('#mapBtn').addEventListener('click', () => { const c = $('#mapcard'), full = c.classList.toggle('full');
  $('#mapBtn').innerHTML = `<i data-lucide="${full ? 'minimize-2' : 'maximize-2'}" class="i18"></i>`; $('#mapBtn').setAttribute('aria-label', full ? '退出全屏' : '全屏地图'); icons($('#mapBtn'));
  if (map) setTimeout(() => map.invalidateSize(), 50); });

function render(data) {
  const trips = (data.trips || []).filter(t => t && t.id && t.start && t.end);
  $('#title').textContent = `${data.owner || '我'} 的旅行`; document.title = $('#title').textContent;
  // stats from finished + ongoing trips
  const counted = trips.filter(t => status(t) !== 'planned');
  const countries = new Set(counted.map(t => t.countryCode || t.country)), cities = new Set(counted.flatMap(t => t.route || []));
  const dates = new Set(); counted.forEach(t => { for (let d = new Date(t.start + 'T12:00:00'); ymd(d) <= t.end; d = new Date(+d + DAY)) dates.add(ymd(d)); });
  $('#stats').innerHTML = [[countries.size, '国家/地区'], [cities.size, '城市'], [dates.size, '天']].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  // upcoming: the soonest as a big hero card, quick links underneath
  const up = trips.filter(t => status(t) !== 'done').sort((a, b) => a.start.localeCompare(b.start));
  $('#upcoming').innerHTML = up.length ? up.map(t => {
    const st = status(t), n = Math.round((new Date(t.start + 'T00:00:00') - new Date(today + 'T00:00:00')) / DAY);
    const cd = st === 'now' ? `<b>第 ${Math.round((new Date(today) - new Date(t.start)) / DAY) + 1} 天</b><span>旅行中</span>` : `<b>${n}</b><span>天后出发</span>`;
    const site = t.site || {}, acts = [['攻略', site.guide, 'book-open'], ['工具箱', site.home, 'briefcase'], ['投票', site.vote, 'vote']].filter(a => a[1]);
    return `<div class="cardwrap"><a class="hero" data-trip="${esc(t.id)}" href="${esc(target(t))}" style="${bg(t)}">
        <span class="pill ${st}"><i></i>${st === 'now' ? '进行中' : '计划中'}</span><span class="cd num">${cd}</span>
        <div class="in"><h3>${esc(t.title)}</h3><div class="meta"><span class="num">${range(t)} · ${days(t)} 天</span><span>${(t.route || []).map(esc).join(' → ')}</span>${t.members ? `<span>${t.members} 人</span>` : ''}</div></div></a>
      ${OWNER_MODE && t.fs ? `<button class="cmenu-b" data-cmenu="${esc(t.id)}" aria-label="${esc(t.title)} 的更多操作"><i data-lucide="ellipsis"></i></button>` : ''}</div>
      ${acts.length ? `<div class="acts">${acts.map(([l, h, ic]) => `<a class="btn btn-sm" href="${esc(h)}"><i data-lucide="${ic}" class="i18"></i>${l}</a>`).join('')}</div>` : '<div style="height:18px"></div>'}`;
  }).join('') : `<div class="empty card"><i data-lucide="plane-takeoff"></i>暂时没有计划中的旅行。<a class="btn btn-sm" href="https://github.com/sangi9faro/sangi9faro.github.io/edit/main/trips.json" target="_blank" rel="noopener">在 trips.json 里加一条</a></div>`;

  // records grouped by the year the trip ended
  const done = trips.filter(t => status(t) === 'done').sort((a, b) => b.end.localeCompare(a.end));
  if (!done.length) $('#records').innerHTML = `<div class="empty card"><i data-lucide="notebook-pen"></i>还没有记录。在 trips.json 里加一条就会出现在这里。<a class="btn btn-sm" href="https://github.com/sangi9faro/sangi9faro.github.io/edit/main/trips.json" target="_blank" rel="noopener">编辑 trips.json</a></div>`;
  else { let h = '', yr = '';
    done.forEach(t => { const y = t.end.slice(0, 4); if (y !== yr) { if (yr) h += '</div>'; yr = y; h += `<div class="year">${y}</div><div class="grid">`; }
      h += `<div class="cardwrap"><a class="tc card" data-trip="${esc(t.id)}" href="${esc(target(t))}"><div class="th" style="${bg(t)}">${photo(t) ? '' : esc(t.country || (t.title || '').slice(0, 2))}</div>
        <div class="tx"><h3>${esc(t.title)}</h3><div class="m num">${range(t)} · ${days(t)} 天</div><div class="m">${esc(t.country || '')}${t.members ? ` · ${t.members} 人` : ''}</div></div></a>${OWNER_MODE && t.fs ? `<button class="cmenu-b" data-cmenu="${esc(t.id)}" aria-label="${esc(t.title)} 的更多操作"><i data-lucide="ellipsis"></i></button>` : ''}</div>`; });
    $('#records').innerHTML = h + '</div>'; }

  document.querySelectorAll('[data-trip]').forEach(el => { el.addEventListener('mouseenter', () => hl(el.dataset.trip, true)); el.addEventListener('mouseleave', () => hl(el.dataset.trip, false)); });
  icons(document);
  buildMap(trips);
}

// ---------- data: trips from Firestore (visitors: trips anyone with the link may see; the owner: all) ----------
// trips.json is still read for trips not in Firestore yet (and as a fallback when Firestore can't be reached)
const OWNER = 'X8BxRGYdemf6Wwb9MtQcLAxpy5q2';
const EMU = !/github\.io$/.test(location.hostname) && (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || new URLSearchParams(location.search).has('emu'));
let OWNER_MODE = false, fsDb = null, fsTrips = {}, legacy = { trips: [] };
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
let fbReady = null;
function firebaseUp() {
  if (fbReady) return fbReady;
  fbReady = (async () => {
    const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
    for (const s of [SDK + 'firebase-app-compat.js', SDK + 'firebase-auth-compat.js', SDK + 'firebase-firestore-compat.js', 'firebase-config.js']) await loadScript(s);
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    if (EMU && !window.__emu) { window.__emu = 1; firebase.auth().useEmulator('http://127.0.0.1:9199', { disableWarnings: true }); firebase.firestore().useEmulator('127.0.0.1', 8080); }
    return firebase.firestore();
  })();
  return fbReady;
}
async function publicFavs(filter) {
  const db = await firebaseUp();
  let q = db.collection('favorites').where('private', '==', false);
  if (filter) q = q.where('tripId', '==', filter);
  return (await q.get()).docs.map(d => ({ id: d.id, ...d.data() }));
}
publicFavs().then(fs => { const l = $('#favLine'); l.innerHTML = `<i data-lucide="heart" class="i18"></i>收藏了 <span class="num">${fs.length}</span> 个地方 ›`; l.hidden = false; icons(l); }).catch(() => {});

const asCard = (id, t) => ({ ...t, id, fs: true, members: Object.keys(t.members || {}).length || null,
  site: { guide: `/t/guide.html?id=${encodeURIComponent(id)}`, home: `/t/?id=${encodeURIComponent(id)}#tools`, vote: (t.modules || {}).vote ? `/t/vote.html?id=${encodeURIComponent(id)}` : null } });
function draw() {
  const list = Object.entries(fsTrips).map(([id, t]) => asCard(id, t));
  for (const t of legacy.trips || []) if (!t.moved && !fsTrips[t.id]) list.push(t);   // trips.json entries not moved to Firestore yet (moved ones are only kept for favorites.html)
  if (map) { map.remove(); map = null; }
  render({ owner: legacy.owner, trips: list });
  // covers arrive after the cards: swap the backgrounds in place
  for (const t of list.filter(x => x.fs && !(x.id in covers))) {
    covers[t.id] = null;
    TripCover.load(fsDb, t.id).then(d => { if (!d) return; covers[t.id] = d;
      document.querySelectorAll(`[data-trip="${CSS.escape(t.id)}"]`).forEach(el => { const box = el.classList.contains('hero') ? el : el.querySelector('.th'); if (box) { box.setAttribute('style', bg(t)); if (box.classList.contains('th')) box.textContent = ''; } }); });
  }
}
async function loadTrips() {
  const db = await firebaseUp(); fsDb = db;
  const q = OWNER_MODE ? db.collection('trips') : db.collection('trips').where('visibility', '==', 'link');
  const snap = await q.get(); fsTrips = {}; snap.docs.forEach(d => { fsTrips[d.id] = d.data(); });
  draw();
}

/* ---------- owner: sign in, new trip, ⋯ menu ---------- */
function drawOwner(user) {
  const el = $('#owner');
  el.innerHTML = OWNER_MODE ? `<span>已登录（旅行主人）</span><button class="linkbtn" id="signOut">退出</button>`
    : `<button class="linkbtn" id="signIn"><i data-lucide="log-in" class="i18"></i> 主人登录</button>`;
  $('#newTrip').hidden = !OWNER_MODE; icons(el);
}
function menuFor(id, x, y) {
  document.querySelectorAll('.cmenu').forEach(m => m.remove());
  const t = fsTrips[id]; if (!t) return;
  const m = document.createElement('div'); m.className = 'cmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<button data-act="edit"><i data-lucide="pencil"></i>编辑</button><button data-act="invite"><i data-lucide="user-plus"></i>邀请（二维码）</button>
    <button data-act="copy"><i data-lucide="link"></i>复制邀请链接</button><button data-act="del" class="bad"><i data-lucide="trash-2"></i>删除</button>`;
  document.body.appendChild(m); icons(m);
  const r = m.getBoundingClientRect(); m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px'; m.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
  m.querySelector('button').focus();
  m.addEventListener('click', async e => {
    const a = e.target.closest('[data-act]'); if (!a) return; m.remove();
    if (a.dataset.act === 'edit') TripEditor.edit({ fs: fsDb, tripId: id, trip: t, onSaved: (nt, cover) => { fsTrips[id] = nt; if (cover) covers[id] = cover.data; draw(); } });
    if (a.dataset.act === 'invite') TripInvite.open({ fs: fsDb, tripId: id, trip: t, onChanged: code => { t.joinCode = code; } });
    if (a.dataset.act === 'copy') TripEditor.toast((await TripInvite.copy(TripInvite.linkFor(id, t.joinCode))) ? '邀请链接已复制' : TripInvite.linkFor(id, t.joinCode));
    if (a.dataset.act === 'del') TripEditor.remove({ fs: fsDb, tripId: id, trip: t, onDeleted: () => { delete fsTrips[id]; draw(); } });
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cmenu]'); if (b) { e.preventDefault(); const r = b.getBoundingClientRect(); menuFor(b.dataset.cmenu, r.left - 160, r.bottom + 6); return; }
  if (!e.target.closest('.cmenu')) document.querySelectorAll('.cmenu').forEach(m => m.remove());
  if (e.target.closest('#signIn')) (EMU ? firebase.auth().signInWithEmailAndPassword('owner@example.com', 'emulator-only') : firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())).catch(er => TripEditor.toast('登录失败：' + er.message));
  if (e.target.closest('#signOut')) firebase.auth().signOut();
  if (e.target.closest('#newTrip')) TripNew.open({ fs: fsDb, uid: firebase.auth().currentUser.uid, onCreated: id => { location.href = `/t/guide.html?id=${encodeURIComponent(id)}`; } });
});
// right-click (desktop) or long-press (phone) on an owner's card opens the same menu
document.addEventListener('contextmenu', e => { const c = e.target.closest('[data-trip]'); if (OWNER_MODE && c && fsTrips[c.dataset.trip]) { e.preventDefault(); menuFor(c.dataset.trip, e.clientX, e.clientY); } });
let pressT = 0;
document.addEventListener('touchstart', e => { const c = e.target.closest('[data-trip]'); if (!OWNER_MODE || !c || !fsTrips[c.dataset.trip]) return; const t0 = e.touches[0];
  pressT = setTimeout(() => { menuFor(c.dataset.trip, t0.clientX, t0.clientY); c.addEventListener('click', ev => ev.preventDefault(), { once: true, capture: true }); }, 600); }, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => clearTimeout(pressT), { passive: true }));

icons(document);
fetch('trips.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { trips: [] }).catch(() => ({ trips: [] })).then(d => { legacy = d; draw(); });
firebaseUp().then(() => firebase.auth().onAuthStateChanged(u => {
  OWNER_MODE = !!u && u.uid === OWNER; drawOwner(u);
  loadTrips().catch(() => { draw(); });
})).catch(() => { $('#owner').innerHTML = ''; });
</script>
</body>
</html>
