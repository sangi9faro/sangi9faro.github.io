<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Faro 的旅行</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Same visual language as the guide pages (Apple-style tokens) */
:root{
  --bg:#f5f5f7; --surface:#fff; --grouped:#f2f2f7; --ink:#1d1d1f; --muted:#86868b; --line:rgba(60,60,67,.12); --accent:#0071e3;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04); --shadow-md:0 4px 14px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--grouped:#2c2c2e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--accent:#0a84ff;--shadow:none;--shadow-md:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--grouped:#2c2c2e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--accent:#0a84ff;--shadow:none;--shadow-md:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em}
.stats{margin:4px 0 6px;color:var(--muted);font-size:15px}
.nav2{display:inline-flex;background:var(--grouped);border-radius:980px;padding:3px;margin-bottom:12px}
.nav2 a{border-radius:980px;padding:5px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.nav2 a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.favline{display:inline-block;margin:0 0 16px;color:var(--accent);font-weight:600;font-size:15px}
.section{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:26px 2px 10px}
#map{height:300px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--grouped)}
.pop a{color:var(--accent);font-weight:600}
/* upcoming: big cards */
.big{display:block;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:16px}
.cover{position:relative;height:180px;background:var(--grouped) center/cover no-repeat}
.cover .nocover{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:700}
.pill{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#1d1d1f;border-radius:980px;padding:4px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#34c759}.pill.now i{background:#ff9500}
.cd{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.big .body{padding:14px 16px 4px}
.big h2{margin:0 0 4px;font-size:22px;letter-spacing:-0.02em}
.meta{color:var(--muted);font-size:14px;display:grid;gap:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 16px}
.acts a{background:var(--grouped);color:var(--accent);border-radius:980px;padding:6px 14px;font-size:14px;font-weight:600}
/* records: small cards */
.year{font-size:20px;font-weight:700;margin:18px 2px 8px}
.small{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px;margin-bottom:10px}
.small .thumb{height:70px;border-radius:12px;background:var(--grouped) center/cover no-repeat;display:grid;place-items:center;color:#fff;font-weight:700}
.small h3{margin:0 0 2px;font-size:16px}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.err{color:#d70015}
.credit{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center}
.credit a{text-decoration:underline}
</style>
</head>
<body>
<main class="wrap">
  <nav class="nav2" aria-label="导航"><a class="on" href="./" aria-current="page">旅行</a><a href="favorites.html">收藏</a></nav>
  <h1 id="title">我的旅行</h1>
  <div class="stats" id="stats">加载中…</div>
  <a class="favline" id="favLine" href="favorites.html" hidden></a>

  <div id="map" role="region" aria-label="足迹地图"></div>

  <div class="section">即将出发</div>
  <div id="upcoming"></div>

  <div class="section">旅行记录</div>
  <div id="records"></div>

  <p class="credit">封面：台北 chsyang（公有领域）· 芽庄 Minh Duc Ly（公有领域），来自 <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> · 地图 © OpenStreetMap<br>
  iPhone 用 Safari「分享 → 添加到主屏幕」，可以像 App 一样打开。</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
// ?today=2027-01-01 lets you preview how the page looks on another date
const TODAY = (() => { const q = new URLSearchParams(location.search).get('today'); const d = q ? new Date(q + 'T12:00:00') : new Date(); return isNaN(d) ? new Date() : d; })();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = ymd(TODAY);
const days = t => Math.round((new Date(t.end) - new Date(t.start)) / DAY) + 1;
const status = t => today < t.start ? 'planned' : today > t.end ? 'done' : 'now';
const md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
const range = t => `${t.start.slice(0, 4)}.${md(t.start)} – ${md(t.end)} · ${days(t)} 天`;
const target = t => (t.site && (t.site.guide || t.site.home)) || `trip.html?id=${encodeURIComponent(t.id)}`;
const color = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#0071e3';
const coverStyle = t => t.cover ? `background-image:url('${encodeURI(t.cover)}')` : `background:linear-gradient(135deg,${color(t.color)},#5ac8fa)`;

function render(data) {
  const trips = (data.trips || []).filter(t => t && t.id && t.start && t.end);
  $('#title').textContent = `${data.owner || '我'} 的旅行`; document.title = $('#title').textContent;

  // stats from finished + ongoing trips
  const counted = trips.filter(t => status(t) !== 'planned');
  const countries = new Set(counted.map(t => t.countryCode || t.country)), cities = new Set(counted.flatMap(t => t.route || []));
  const dates = new Set(); counted.forEach(t => { for (let d = new Date(t.start + 'T12:00:00'); ymd(d) <= t.end; d = new Date(+d + DAY)) dates.add(ymd(d)); });
  $('#stats').textContent = `去过 ${countries.size} 个国家/地区 · ${cities.size} 个城市 · 共 ${dates.size} 天`;

  // upcoming (planned + ongoing), soonest first
  const up = trips.filter(t => status(t) !== 'done').sort((a, b) => a.start.localeCompare(b.start));
  $('#upcoming').innerHTML = up.length ? up.map(t => {
    const st = status(t), n = Math.round((new Date(t.start + 'T00:00:00') - new Date(today + 'T00:00:00')) / DAY);
    const cd = st === 'now' ? `第 ${Math.round((new Date(today) - new Date(t.start)) / DAY) + 1} 天` : `还有 ${n} 天`;
    const site = t.site || {}, acts = [['攻略', site.guide], ['工具箱', site.home], ['投票', site.vote]].filter(a => a[1]);
    return `<div class="big"><a href="${esc(target(t))}">
      <div class="cover" style="${coverStyle(t)}">${t.cover ? '' : `<span class="nocover">${esc(t.title)}</span>`}
        <span class="pill ${st}"><i></i>${st === 'now' ? '进行中' : '计划中'}</span><span class="cd">${cd}</span></div>
      <div class="body"><h2>${esc(t.title)}</h2><div class="meta"><span>${range(t)}${t.members ? ` · ${t.members} 人` : ''}</span><span>${(t.route || []).map(esc).join(' → ')}</span></div></div></a>
      ${acts.length ? `<div class="acts">${acts.map(([l, h]) => `<a href="${esc(h)}">${l} ›</a>`).join('')}</div>` : '<div style="height:12px"></div>'}</div>`;
  }).join('') : `<div class="empty">暂时没有计划中的旅行。</div>`;

  // records grouped by the year the trip ended, newest first
  const done = trips.filter(t => status(t) === 'done').sort((a, b) => b.end.localeCompare(a.end));
  if (!done.length) $('#records').innerHTML = `<div class="empty">还没有记录。在 trips.json 里加一条就会出现在这里。</div>`;
  else { let h = '', yr = '';
    done.forEach(t => { const y = t.end.slice(0, 4); if (y !== yr) { yr = y; h += `<div class="year">${y}</div>`; }
      h += `<a class="small" href="${esc(target(t))}"><div class="thumb" style="${coverStyle(t)}">${t.cover ? '' : esc((t.title || '').slice(0, 2))}</div>
        <div><h3>${esc(t.title)}</h3><div class="meta"><span>${range(t)}</span><span>${esc(t.country || '')}${t.members ? ` · ${t.members} 人` : ''}</span></div></div></a>`; });
    $('#records').innerHTML = h; }

  // footprint map
  if (!window.L) { $('#map').innerHTML = '<p style="padding:16px;color:var(--muted)">地图加载失败，检查一下网络。</p>'; return; }
  const map = L.map('map', { zoomControl: false, scrollWheelZoom: false }); L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const pts = [];
  trips.forEach(t => { const ps = (t.places || []).filter(p => typeof p.lat === 'number' && typeof p.lng === 'number'); if (!ps.length) return;
    if (ps.length > 1) L.polyline(ps.map(p => [p.lat, p.lng]), { color: color(t.color), weight: 2, opacity: .7, dashArray: '5,6' }).addTo(map);
    ps.forEach(p => { pts.push([p.lat, p.lng]);
      L.circleMarker([p.lat, p.lng], { radius: 7, color: '#fff', weight: 2, fillColor: color(t.color), fillOpacity: .95 }).addTo(map)
        .bindPopup(`<div class="pop"><b>${esc(t.title)}</b> · ${esc(p.name)}<br><a href="${esc(target(t))}">进入这次旅行 ›</a></div>`); }); });
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 9 }); else map.setView([20, 110], 3);
}


// public favourites (no sign-in needed: rules let anyone read non-private docs)
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
async function publicFavs(filter) {
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  for (const s of [SDK + 'firebase-app-compat.js', SDK + 'firebase-firestore-compat.js', 'firebase-config.js']) await loadScript(s);
  if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  let q = firebase.firestore().collection('favorites').where('private', '==', false);
  if (filter) q = q.where('tripId', '==', filter);
  return (await q.get()).docs.map(d => ({ id: d.id, ...d.data() }));
}
publicFavs().then(fs => { const l = $('#favLine'); l.textContent = `收藏了 ${fs.length} 个地方 ›`; l.hidden = false; }).catch(() => {});

fetch('trips.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render)
  .catch(() => { $('#stats').innerHTML = '<span class="err">trips.json 读取失败，检查一下文件格式。</span>'; });
</script>
</body>
</html>
