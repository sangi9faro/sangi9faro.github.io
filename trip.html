<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>旅行详情</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f5f5f7; --surface:#fff; --grouped:#f2f2f7; --ink:#1d1d1f; --muted:#86868b; --line:rgba(60,60,67,.12); --accent:#0071e3;
  --red:#ff3b30; --blue:#007aff; --purple:#af52de; --orange:#ff9500; --gray:#aeaeb2;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans SC","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1c1c1e;--grouped:#2c2c2e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--accent:#0a84ff;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--grouped:#2c2c2e;--ink:#f5f5f7;--muted:#98989d;--line:rgba(84,84,88,.55);--accent:#0a84ff;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.back{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:1000;background:rgba(255,255,255,.92);color:#1d1d1f;border-radius:980px;padding:6px 12px;font-size:14px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.hero{height:220px;background:var(--grouped) center/cover no-repeat;position:relative}
.hero .nocover{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;padding:0 20px;text-align:center}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 6px;font-size:28px;letter-spacing:-0.025em}
.meta{color:var(--muted);font-size:14px;display:grid;gap:2px}
.summary{margin:12px 0 0}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-top:14px}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.section{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:26px 2px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tab{flex-shrink:0;border:0;border-radius:980px;padding:7px 16px;background:var(--grouped);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
#map{height:260px;border-radius:14px;overflow:hidden;margin:12px 0;box-shadow:var(--shadow)}
.dh{margin:4px 2px 10px}.dh b{font-size:19px}.dh span{color:var(--muted);font-size:14px;margin-left:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:14px;bottom:14px;width:1.5px;background:var(--line)}
.item{position:relative;margin-bottom:10px}
.dot{position:absolute;left:-20px;top:18px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.item .card{margin:0}
.time{font-size:12px;font-weight:600;color:var(--muted)}
.name{font-size:16px;font-weight:600;margin:2px 0}
.desc{font-size:14px;color:var(--muted)}
.notes p{margin:0 0 10px}
.links a{display:block;padding:10px 0;border-top:1px solid var(--line);font-weight:600}
.links a:first-child{border-top:0}
.missing{text-align:center;padding:80px 16px}
.fav{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink)}
.fav:first-child{border-top:0}
.fav .st{color:#ff9f0a;white-space:nowrap}
</style>
</head>
<body>
<a class="back" href="./">← 我的旅行</a>
<div id="app"><p style="padding:80px 16px;text-align:center;color:var(--muted)">加载中…</p></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^(https?:\/\/|\/)/i.test(u || '') ? u : '';
const DAY = 86400000, md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
const color = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#0071e3';
const TYPE_COLOR = { food: 'var(--red)', spot: 'var(--blue)', drink: 'var(--purple)', hotel: 'var(--orange)', transport: 'var(--gray)' };
const id = new URLSearchParams(location.search).get('id');
const app = document.getElementById('app');

function notFound() {
  document.title = '没有找到这次旅行';
  app.innerHTML = `<div class="missing"><h1>没有找到这次旅行</h1><p class="meta">链接里的 id 不对，或者这次旅行已经从 trips.json 删掉了。</p><p><a href="./">← 回到我的旅行</a></p></div>`;
}
function render(t) {
  document.title = t.title;
  const n = Math.round((new Date(t.end) - new Date(t.start)) / DAY) + 1;
  const site = t.site || null, siteLink = site && safeUrl(site.guide || site.home);
  let h = `<div class="hero" style="${t.cover ? `background-image:url('${encodeURI(t.cover)}')` : `background:linear-gradient(135deg,${color(t.color)},#5ac8fa)`}">${t.cover ? '' : `<span class="nocover">${esc(t.title)}</span>`}</div>
  <div class="wrap"><h1>${esc(t.title)}</h1>
    <div class="meta"><span>${t.start.slice(0, 4)}.${md(t.start)} – ${md(t.end)} · ${n} 天${t.members ? ` · ${t.members} 人` : ''}</span><span>${(t.route || []).map(esc).join(' → ')}${t.country ? ' · ' + esc(t.country) : ''}</span></div>
    ${t.summary ? `<p class="summary">${esc(t.summary)}</p>` : ''}
    ${siteLink ? `<div class="card note">这次旅行有完整网站：<a href="${esc(siteLink)}">打开 ›</a></div>` : ''}`;
  const days = Array.isArray(t.days) ? t.days.filter(d => d && Array.isArray(d.locations)) : [];
  if (days.length) h += `<div class="section">行程</div><div class="tabs" id="tabs">${days.map((d, i) => `<button class="tab${i ? '' : ' on'}" data-i="${i}">${esc(d.label || 'D' + (i + 1))}</button>`).join('')}</div><div id="map"></div><div id="day"></div>`;
  if (t.notes) h += `<div class="section">游记</div><div class="card notes">${String(t.notes).split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}</div>`;
  const links = (t.links || []).filter(l => l && safeUrl(l.url));
  if (links.length) h += `<div class="section">链接</div><div class="card links">${links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title || l.url)} ›</a>`).join('')}</div>`;
  h += `<div id="tripFavs"></div>`;
  app.innerHTML = h + '</div>';
  showFavs(t);
  if (!days.length) return;

  // read-only day view: tabs + map + timeline (same idea as guide.html)
  let map = null, layer = null;
  if (window.L) { map = L.map('map', { zoomControl: false, scrollWheelZoom: false }); L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map); layer = L.layerGroup().addTo(map); }
  else document.getElementById('map').hidden = true;
  function show(i) {
    const d = days[i], locs = d.locations.filter(l => l && l.name);
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    const main = locs.filter(l => l.time !== '—'), alt = locs.filter(l => l.time === '—');
    const item = l => `<div class="item"><span class="dot" style="background:${TYPE_COLOR[l.type] || 'var(--gray)'}"></span><div class="card"><div class="time">${l.time && l.time !== '—' ? esc(l.time) : '备选'}</div><div class="name">${esc(l.name)}</div>${l.desc ? `<div class="desc">${esc(l.desc)}</div>` : ''}</div></div>`;
    document.getElementById('day').innerHTML = `<div class="dh"><b>${esc(d.title || '')}</b><span>${esc(d.date || '')}</span></div>
      ${main.length ? `<div class="tl">${main.map(item).join('')}</div>` : ''}${alt.length ? `<div class="section">备选</div><div class="tl">${alt.map(item).join('')}</div>` : ''}`;
    if (!map) return;
    layer.clearLayers();
    const pts = locs.filter(l => typeof l.lat === 'number' && typeof l.lng === 'number').map(l => { L.circleMarker([l.lat, l.lng], { radius: 7, color: '#fff', weight: 2, fillColor: color(t.color), fillOpacity: .95 }).addTo(layer).bindPopup(`<b>${esc(l.name)}</b>`); return [l.lat, l.lng]; });
    if (pts.length > 1) L.polyline(pts, { color: color(t.color), weight: 2, opacity: .6, dashArray: '5,6' }).addTo(layer);
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 });
  }
  document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.i); });
  show(0);
}

// public favourites (no sign-in needed: rules let anyone read non-private docs)
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = false; el.onload = res; el.onerror = () => rej(new Error(src)); document.head.appendChild(el); }); }
async function publicFavs(filter) {
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  for (const s of [SDK + 'firebase-app-compat.js', SDK + 'firebase-firestore-compat.js', 'firebase-config.js']) await loadScript(s);
  if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  let q = firebase.firestore().collection('favorites').where('private', '==', false);
  if (filter) q = q.where('tripId', '==', filter);
  return (await q.get()).docs.map(d => ({ id: d.id, ...d.data() }));
}
async function showFavs(t) {
  try {
    const fs = (await publicFavs(t.id)).sort((a, b) => b.rating - a.rating); if (!fs.length) return;
    document.getElementById('tripFavs').innerHTML = `<div class="section">这次旅行的收藏</div><div class="card">${fs.map(f => `<a class="fav" href="favorites.html?trip=${encodeURIComponent(t.id)}"><span>${esc(f.name)}</span><span class="st">${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}</span></a>`).join('')}</div>`;
  } catch (e) {}
}
if (!id) notFound();
else fetch('trips.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { const t = (d.trips || []).find(x => x.id === id); t && t.start && t.end ? render(t) : notFound(); }).catch(notFound);
</script>
</body>
</html>
